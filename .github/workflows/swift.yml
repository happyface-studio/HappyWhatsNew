name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Pick an iPhone simulator
      run: |
        UDID=$(xcrun simctl list devices available -j \
          | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
        echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
    - name: Build and test (iOS Simulator)
      run: xcodebuild test -scheme HappyWhatsNew -destination "id=$SIMULATOR_UDID"
